    files: ["adapters/claude-code/anchor_render.py"]

  - id: R30
    pattern: "a private codename used as a quoted role name in a test"
    replacement: "\"project-b\""
    why: "Runs before R7. R7 would make the role \"PROJECT-B\", which is not a valid role name (lowercase
          letters, digits, hyphens), and the shipped handoff test would fail for that reason alone. (2026-10-27)"
    occurrences: 2
    files: ["adapters/claude-code/test_handoff_resolve.py"]

  - id: R31
    pattern: "${_cs_root}/adapters/claude-code/, RENDERER=\"${ROOT}/adapters/claude-code/anchor_render.py\", and a test's
             '&& pwd)/adapters/claude-code/anchor_render.py' (the forms R13 produces)"
