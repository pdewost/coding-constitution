# Deliberate, reviewed hits that the §4 gate is configured to allow. Anything not
# listed in publish_scan.py's EXCEPTIONS fails the gate.
declared_exceptions:   # mirrors the 8 EXCEPTIONS in publish_scan.py (2026-10-28)
  - {file: LICENSE, pattern: owner-name, why: "A copyright notice must name its holder."}
  - {file: LICENSE, pattern: owner-name, why: "The same notice in its pre-2026-08 form, in published history."}
  - {file: NOTICE, pattern: owner-name, why: "As above, in NOTICE."}
  - {file: governance/scripts/continuity_sweep.py, pattern: absolute-home-path, why: "The prefix list the sweep uses to recognise absolute paths, not a path. History-only since v0.13.1 (the current tree splits the literal); kept because published commits hold it."}
  - {file: governance/scripts/continuity_sweep.py, pattern: local-database, why: "A list of file extensions, not a database filename."}
  - {file: ANTIGRAVITY.md, pattern: absolute-home-path, why: "A rule forbidding hardcoded paths, citing the sandbox paths it forbids (published history)."}
  - {file: ANTIGRAVITY.md, pattern: local-database, why: "A rule requiring these extensions be gitignored (published history)."}
  - {file: adapters/claude-code/test_anchor_render.py, pattern: generic-secret-assign, why: "A synthetic token a test plants and asserts never leaks."}

# ALREADY-PUBLISHED EXPOSURE — what a scrub of HEAD cannot reach.
#
# Editing a file removes it from the working tree, not from the commits already on the
# remote. `publish_scan.py --full-history` enumerates this; it is recorded here so nobody
# mistakes a clean tree for a clean repository. Audited 2026-08-25 over 20 commits.
# The last two entries are not exposure: they declare two names the current tree keeps on
# purpose (the clone URL's account, the copyright holder), beside the exposure they relate to.
historical_exposure:   # re-audited 2026-10-29 over every commit reachable from HEAD; public base after the rewrite: 75c6116 (formerly 4a5b001)
  - what: "a third party's surname, as INCIDENT_<NAME>_20260309"
    status: "REMOVED by the 2026-08 history rewrite: every reachable commit reads INCIDENT_CONTACT_DELETION_20260309.
             The commit ids this file used to cite predate that rewrite and no longer exist."
  - what: "a second third party's surname, as an incident label dated 20260402 (docs/safety-rules.md, 14 commits:
           added in 405b073, deleted in 8a3ef05; list them with `git log --oneline 405b073~1..8a3ef05~1`)"
    status: "REMOVED by the 2026-10-28 history rewrite (founder ruling 2026-10-28), published with v0.13 (r8)."
  - what: "the author's contact e-mail in the author and committer fields of every commit"
    status: "RE-AUTHORED in the same 2026-10-28 rewrite with a no-reply address (founder ruling 2026-10-28); the
             name stays (the copyright holder)."
  - what: "a private project codename; a home-directory path and local database filenames"
    status: "not found in any commit reachable from the published tip by publish_scan's history scan with the
             private term list (re-run 2026-10-28 on r4 and 2026-10-29 on r5 to r8). An unpublished intermediate v0.13
             commit held a script with a home path and a job's run time; v0.13 folds the unpublished commits into one, so it was never
             published. The ids cited before the 2026-08 rewrite no longer exist."
  - what: "machine facts in comments (an interpreter remark, a scheduled job and its run time) in closeout_lint.py,
           stop_closeout_gate.py, skill_index_regen.py and test_stop_closeout_advisory.py; the stock interpreter's
           patch version in session_anchor.sh; the author's forbidden-window and job times in pretool_guard.py's deny
           text and in two hook tests"
    status: "PUBLISHED in v0.12 and earlier; removed from the current tree by R38-R38c (2026-10-28), R32, R37, R37b
             (2026-10-28) and R44 (2026-10-29). History keeps them. This map names those rules without their values."
  - what: "a class, not a list: names, folders and figures from the author's private workspace kept in code, comments,
           tests and specs. For example: skills (local_llm, notify, sprint_closeout, github_commit_audit, visual_audit,
           calendar_bridge, applescript_bridge, applescript_operations, strategic_rebase), files and folders
           (llm_client.py, supervisor.py, dashboard_app.py, cold_start_ledger.jsonl, OPERATOR_CRAFT.md,
           _interaction_log/), and fleet or corpus figures ('62 of 133', '48 of 60', '1 of 22', '~13 of 22',
           '(9 projects)', a transcript count in closeout_lint.py)"
    status: "KEPT and declared as a class (r5; examples widened in r6 and r7, 2026-10-29). No list of such names can be
             shown complete, so none is claimed. Each example above was already public in v0.12 (75c6116), except three
             new mentions of _interaction_log/ in v0.13. They name the author's tools for provenance and none is shipped
             (README, Status). Renaming would change code (judges.py imports local_llm in its default model call) without
             reducing exposure. The examples can be found with `git grep -n -w -E 'local_llm|notify|sprint_closeout|github_commit_audit|visual_audit|calendar_bridge|applescript_bridge|applescript_operations|strategic_rebase|llm_client.py|supervisor.py|dashboard_app.py|cold_start_ledger.jsonl|OPERATOR_CRAFT|_interaction_log|62 of 133|48 of 60|1 of 22|13 of 22|9 projects|transcripts' -- . ':!redaction_map.yaml'`."
  - what: "the author's clone-folder name (the R21 class) in a hook, a hook test and a policy row"
    status: "PUBLISHED in fee48bc only (introduced there; replaced by R21 from 75c6116, v0.12, 2026-10-08). History
             keeps it. The account handle inside it is already public in README's clone URL. (Declared 2026-11-08, s220 F14.)"
  - what: "the author's forbidden window and a scheduled job's run time, given as a worked example in docs/operational-safety.md and ANTIGRAVITY.md"
    status: "PUBLISHED in the range 405b073~1..836f741; absent from the current tree. History keeps them. This map names the files without the values. (Declared 2026-11-08.)"
  - what: "the owner's account name, lower case, in README's clone URL"
    status: "INTENTIONAL — it is this repository's own address. publish_scan's owner-name class is case-sensitive and
             does not match it; case-folding that class (with this URL and the no-reply identity as exceptions) is
             planned for the next version."
  - what: "the copyright holder's name in LICENSE and NOTICE"
    status: "INTENTIONAL — see declared_exceptions"

# Content that exists only here and has no workspace counterpart.
public_only:
  - README.md            # written for adopters
  - LICENSE
  - DECLARATION.md
  - ANTIGRAVITY.md       # superseded-2025 stub, kept for lineage
  - redaction_map.yaml   # this file
  - publish_scan.py      # the §4 gate
  - reviews/             # scrubbed review records
  - _skills/adversarial_review/   # frozen at its published v1.1.0 since 2026-10-08: the private skill documents the review fleet

# Never extracted, under any circumstance.
firewalled:
  - "every NEOCORTEX/ (project state) and every _archive/"
  - "all personal data, contact stores, databases, transcripts and session records"
  - "the real machine_config.yaml (machine facts, forbidden windows) and the notification config"
  - "every project-specific CLAUDE.md, and any document naming a private project"
