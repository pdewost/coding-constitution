# redaction_map.yaml — every intentional difference between this public repository
# and the private workspace it is extracted from.
#
# WHY THIS FILE EXISTS. This repo is a clean-room extraction of an allowlist, not a
# mirror. Without a declared map, "the public copy differs from the source" is an
# argument every time someone notices; with one, it is an assertion a script can make.
# It was written after a 2026-08-25 measurement found 6 of 8 allowlisted files had
# drifted unnoticed — the published spec was two ratified revisions behind, one hook
# differed by 265 lines, and the record described the constitution's own divergence as
# "scrub-only (attribution + one pointer)" when it was in fact four hunks, two of them
# substantive wording changes rather than redactions.
#
# CONTRACT: a difference not listed here is drift, not redaction, and should be fixed
# by re-running the extraction — never by editing the public copy in place.

version: 1
extracted: 2026-08-25
re_extracted: 2026-11-08   # v0.13.2: no new rule, one more historical_exposure entry; test_install_adapters_canonical_root.py added to the allowlist. v0.13.1 (first extraction 2026-11-07): R40b added (s220 F6). v0.13 r6 (2026-10-29): R45, R45b added (r5: R44; r4, 2026-10-28: R5 changed; R29-R43b added; 14 files added to the allowlist)
source: "a private multi-project workspace (not published)"
method: "clean-room allowlist extraction; see PROTOCOL_publish_regime §1/§5 in the private tree"
gate: "publish_scan.py — the §4 pre-publish scan, as code; exit 0 required before any push"

redactions:
  - id: R1
    pattern: "<absolute workspace path>"
    replacement: "$WORKSPACE"
    why: "Absolute paths identify the owner's username and machine layout, and would not
          work for any adopter. Portable variable instead."
    occurrences: 0   # none remained in the 2026-08-25 extraction

  - id: R2
    pattern: "<absolute home path>"
    replacement: "$HOME"
    why: "Same reason as R1, one level up."
    occurrences: 0

  - id: R3
    pattern: "by <owner name>, "
    replacement: ""
    why: "Personal attribution in the constitution's ratification line. The ratification
          is a fact; the name is personal data and adds nothing for an adopter."
    occurrences: 1
    files: ["PAICodeConstitution-2026.md"]

  - id: R4
    pattern: ", from the <private project> outage"
    replacement: ""
    why: "Amendment I's provenance names the private project whose production incident
          prompted it. The amendment stands on its own text."
    occurrences: 1
    files: ["PAICodeConstitution-2026.md"]

  - id: R5
    pattern: "enforcement spec: `governance/AMENDMENT_I_PROPOSAL_2026-06-10.md` §L1"
    replacement: "L1 reminder: the destructive-operation guardrail in `adapters/claude-code/hooks/prompt_guardrail.sh`"
    why: "The original pointer targets a governance artifact that is not on the publish
          allowlist. Until 2026-10-27 it was repointed at spec/NEOCORTEX_SPEC.md, which has no
          Amendment I section, so the pointer (and its '§L1') dangled. It now names what ships:
          the reminder the guardrail hook injects on destructive prompts. (2026-10-27)"
    occurrences: 1
    files: ["PAICodeConstitution-2026.md"]

  - id: R6..R10
    pattern: "<private project codenames>"
    replacement: "PROJECT-A … PROJECT-E"
    why: "Lesson comments in the hooks and skills cite the incidents that produced them.
          The lessons are the reusable part; the codenames are not."
    note: "Patterns are case-INSENSITIVE and bounded on letters, not on \\b word boundaries.
           A \\b-anchored name misses BOTH the underscore-joined form (INCIDENT_<NAME>_<date>,
           because underscore is itself a word character) AND lowercased occurrences inside
           identifiers. A §5.5 reviewer found the gate reporting already-published commits
           clean for exactly that reason. One codename is kept case-SENSITIVE on purpose:
           its lowercase form is ordinary hardware vocabulary and folding case would make
           the gate cry wolf on legitimate prose."
    occurrences: "recount at each extraction; grep the publish set excluding this file"

  - id: R12
    pattern: "<a reviewer codename> / <a third party's surname>"
    replacement: "REDACTED-INCIDENT"
    why: "One was an internal review codename; the other was ruled by the founder to be a
          PERSON'S NAME — it labelled the 2026-03 incident behind DENY-CONTACT-DELETE, a
          policy that exists because an AppleScript destroyed a real Contacts entry. A
          surname attached to a destroyed record is third-party personal data, not a label."

  - id: R13..R15
    pattern: "governance/adapters/claude-code/ · governance/policy/POLICY_CORE.md · governance/NEOCORTEX_SPEC.md"
    replacement: "adapters/claude-code/ · spec/POLICY_CORE.md · spec/NEOCORTEX_SPEC.md"
    why: "LAYOUT, not secrecy. The private tree keeps the kit under governance/; the published
          repo puts it at the root. These rewrite references to files IN THIS REPO."
    important: "References to files in the ADOPTER'S OWN workspace — governance/routing_policy.yaml,
                governance/adapters/INSTALLED.json, governance/hook_heartbeat.log — are deliberately
                NOT rewritten. Those paths are correct: the adopter creates that directory. Conflating
                the two left the adapter README pointing at paths that resolved nowhere."

  - id: R11
    pattern: "<personal contact handle>"
    replacement: ""
    why: "Personal contact data."
    occurrences: 0

  - id: R16
    pattern: "<an example macOS home path>"
    replacement: "/srv/example"
    why: "Example home paths in tests and comments. Not the HOME variable: an unresolved variable would change
          what two tests assert. (2026-10-07)"

  - id: R17
    pattern: "<a private project folder name>"   # the pattern IS the private name, so it is not listed
    replacement: "Example Projects"
    why: "A private project folder name in a test fixture. (2026-10-07)"

  - id: R18
    pattern: "<the private workspace folder name>"   # same reason
    replacement: "workspace"
    why: "LAYOUT: the private workspace folder name, in a comment. (2026-10-07)"

  # --- publish S4 (2026-10-08): a confined review of the bundle found leaks the scan's term list did not know.
  - id: R12b
    pattern: "<an external reviewer's internal name>, any case"
    replacement: "reviewer A"
    why: "Founder ruling 2026-10-08: the reviewer is named neutrally everywhere. Until then only the
          all-caps form was replaced, with REDACTED-INCIDENT, which left the mixed-case name in
          hook comments and once broke a shell variable name. (2026-10-08)"

  - id: R12c
    pattern: "<the same name>_ (inside a record filename)"
    replacement: "REVIEWER_A"
    why: "Keeps a quoted filename one word. (2026-10-08)"

  - id: R20
    pattern: "EXTRA_TARGETS = (<the author's own clone folder>,)"
    replacement: "EXTRA_TARGETS = ()"
    why: "BEHAVIOUR, declared: the author's extra install target is his own folder; shipped, it
          leaked his layout and made --check fail for every adopter. Adopters list their own. (2026-10-08)"

  - id: R21
    pattern: "<the author's clone folder name>"
    replacement: "GitHub example repositories"
    why: "A personal folder name in comments, a test fixture and a policy row. The replacement keeps
          its spaces: the L0 clone-path test is about a path WITH spaces. (2026-10-08)"

  - id: R22
    pattern: "<a private project folder name>"
    replacement: "example-project"
    why: "A private project folder in stop-gate comments and a test docstring. (2026-10-08)"

  - id: R23
    pattern: "the canonical kit `adapters/claude-code/**` (as R13 leaves it)"
    replacement: "the canonical kit (`adapters/claude-code/**` in this repository, installed as
                  `governance/adapters/claude-code` in a workspace)"
    why: "Comment accuracy: after R13 the approved-list comment named the repo path while the code
          checks the workspace path. (2026-10-08)"

  - id: R24
    pattern: "<a private typeface project name>_PROOF.html · <a private design-folder path>"
    replacement: "<FONT>_PROOF.html · the typography project's AUDIT_PERSONAS.md"
    why: "BY HAND, in _skills/adversarial_review/SKILL.md (public_only since 2026-10-08, see below):
          one line of the published skill named a private typeface project and a private folder. (2026-10-08)"

  # --- publish S4 re-check (2026-10-08)
  - id: R25
    pattern: "<a worktree folder that spells out a private project>"
    replacement: "example-project"
    why: "A worktree folder name in a build_index.py comment. (2026-10-08)"

  - id: R28
    pattern: "the guard's comment 'The wiring (P7) adds these tools to this guard's matcher'"
    replacement: "a comment saying the published settings route Bash and the osascript tool, not the editing tools"
    why: "Founder ruling 'A: live parity' (2026-10-08): this release wires the guard exactly as the author's live workspace
          does; the comment is made true for this repository. (R26/R27, written for a rewired kit, were withdrawn
          before publication.) (2026-10-08)"

  # --- v0.13 (2026-10-27)
  - id: R29
    pattern: "the HEAVY_SEVEN tuple in anchor_render.py (seven private project folder names)"
    replacement: "seven entries: \"governance\" and example-project-1 to -6, with a comment telling an adopter to list their own"
    why: "The cold-start measurement table named the author's seven heaviest projects; two of those
